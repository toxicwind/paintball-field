<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f0f23" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strong-glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Hex grid overlay -->
  

  <!-- Radar rings -->
  <circle cx="200" cy="200" r="64" fill="none" stroke="#6366f1" stroke-width="2.0" opacity="0.30" />
<circle cx="200" cy="200" r="89" fill="none" stroke="#6366f1" stroke-width="1.7" opacity="0.47" />
<circle cx="200" cy="200" r="114" fill="none" stroke="#6366f1" stroke-width="1.4" opacity="0.63" />

  <!-- Center crosshair -->
  <line x1="190" y1="200" x2="210" y2="200" stroke="#6366f1" stroke-width="2"/>
  <line x1="200" y1="190" x2="200" y2="210" stroke="#6366f1" stroke-width="2"/>
  <circle cx="200" cy="200" r="4" fill="#10b981" filter="url(#glow)"/>

  <!-- Sweep line -->
  <line x1="200" y1="200" x2="288.4" y2="111.6" stroke="#f472b6" stroke-width="2" opacity="0.6" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Particle trails -->
  <line x1="300.9" y1="203.5" x2="330.9" y2="204.6" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
<line x1="118.8" y1="124.3" x2="96.9" y2="103.8" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
<line x1="152.8" y1="107.3" x2="139.2" y2="80.6" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
<line x1="292.6" y1="264.8" x2="317.1" y2="282.0" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
<line x1="202.0" y1="87.0" x2="202.5" y2="57.0" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
<line x1="289.5" y1="160.1" x2="316.9" y2="147.9" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
<line x1="212.4" y1="111.9" x2="216.6" y2="82.2" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
<line x1="118.8" y1="263.4" x2="95.2" y2="281.9" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
<line x1="274.3" y1="165.3" x2="301.5" y2="152.7" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
<line x1="196.2" y1="307.9" x2="195.2" y2="337.9" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
<line x1="291.9" y1="185.5" x2="321.5" y2="180.8" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
<line x1="107.0" y1="239.5" x2="79.4" y2="251.2" stroke="#f472b6" stroke-width="1" opacity="0.4"/>

  <!-- Player dots -->
  <circle cx="315.4" cy="224.5" r="3" fill="#f472b6"/>
<circle cx="278.64560300880714" cy="272.5525266781323" r="7" fill="#10b981" opacity="0.3"/><circle cx="278.6" cy="272.6" r="3" fill="#10b981"/>
<circle cx="230.8" cy="273.8" r="3" fill="#a78bfa"/>
<circle cx="226.7835678733737" cy="270.05455368477044" r="8" fill="#f472b6" opacity="0.3"/><circle cx="226.8" cy="270.1" r="4" fill="#f472b6"/>
<circle cx="178.0" cy="258.0" r="5" fill="#f472b6"/>
<circle cx="96.9" cy="263.3" r="3" fill="#f472b6"/>
<circle cx="137.0" cy="199.8" r="4" fill="#a78bfa"/>
<circle cx="137.60188335844157" cy="185.77062757580407" r="7" fill="#10b981" opacity="0.3"/><circle cx="137.6" cy="185.8" r="3" fill="#10b981"/>
<circle cx="137.42479210957606" cy="150.15681232635472" r="9" fill="#f472b6" opacity="0.3"/><circle cx="137.4" cy="150.2" r="5" fill="#f472b6"/>
<circle cx="173.7" cy="100.4" r="3" fill="#10b981"/>
<circle cx="225.50561366057042" cy="97.11431745963034" r="7" fill="#10b981" opacity="0.3"/><circle cx="225.5" cy="97.1" r="3" fill="#10b981"/>
<circle cx="252.46603154802747" cy="140.9380364904672" r="7" fill="#a78bfa" opacity="0.3"/><circle cx="252.5" cy="140.9" r="3" fill="#a78bfa"/>
<circle cx="261.23165391651105" cy="145.45933114960343" r="7" fill="#a78bfa" opacity="0.3"/><circle cx="261.2" cy="145.5" r="3" fill="#a78bfa"/>

  <!-- Glow pulses -->
  <circle cx="200" cy="200" r="101" fill="none" stroke="#10b981" stroke-width="1" opacity="0.2"><animate attributeName="r" values="101;111;101" dur="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.05;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
<circle cx="200" cy="200" r="67" fill="none" stroke="#10b981" stroke-width="1" opacity="0.2"><animate attributeName="r" values="67;77;67" dur="3.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.05;0.2" dur="3.7s" repeatCount="indefinite"/></circle>
<circle cx="200" cy="200" r="81" fill="none" stroke="#10b981" stroke-width="1" opacity="0.2"><animate attributeName="r" values="81;91;81" dur="2.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.05;0.2" dur="3.6s" repeatCount="indefinite"/></circle>

  <!-- Text -->
  <text x="200" y="360" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="28" font-weight="bold" fill="#6366f1" letter-spacing="4" filter="url(#glow)">SPECTRE</text>
  <text x="200" y="385" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="14" font-weight="300" fill="#a78bfa" letter-spacing="8">BAND</text>

  <!-- Seed watermark -->
  <text x="390" y="390" text-anchor="end" font-family="monospace" font-size="8" fill="#a78bfa" opacity="0.3">fda59fb0</text>
</svg>