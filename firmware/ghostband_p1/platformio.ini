[env:heltec_ht_ct62]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
lib_deps = 
    heltecautomation/Heltec ESP32 Dev-Boards @ ^1.1.2
    miguelbalboa/MFRC522 @ ^1.4.10
    adafruit/Adafruit NeoPixel @ ^1.12.0
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -D LORA_BAND=915E6
    -D LORA_SF=7
    -D LORA_BW=125E3
    -D LORA_CR=4/5
    -D LORA_TX_POWER=14
    -D HEARTBEAT_INTERVAL_MS=5000
    -D RFID_POLL_INTERVAL_MS=500
    -D DEEP_SLEEP_MS=4500
    -D LED_PIN=25
    -D VIBE_PIN=26
    -D RFID_SS_PIN=5
    -D RFID_RST_PIN=27
